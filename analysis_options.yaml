include: package:lint_rules/analysis_options.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "**/*.freezed.g.dart"
    - "**/*.gr.dart"
    - "**/*.gen.dart"
    - "**/generated_plugin_registrant.dart"
    - "**/firebase_options.dart"
  errors:
    invalid_annotation_target: ignore # Freezed compatibility
  plugins:
    - custom_lint
