name: handbook_for_valorant
description: A Valorant handbook app with agents, maps, weapons, store, and profile.
publish_to: 'none'
version: 2.1.1+1

environment:
  sdk: ^3.11.0
  flutter: ">=3.41.0"

dependencies:
  flutter:
    sdk: flutter

  # Modules
  core:
    path: modules/core
  theme_module:
    path: modules/theme_module
  gen:
    path: modules/gen

  # Icons
  cupertino_icons: ^1.0.2

  # State Management
  flutter_bloc: 9.1.1
  bloc: 9.2.0

  # Code Generation Annotations
  freezed_annotation: 3.1.0
  json_annotation: 4.9.0
  equatable: 2.0.8

  # Routing
  auto_route: 11.1.0

  # Dependency Injection
  get_it: 9.2.1

  # HTTP
  dio: 5.9.2

  # Local Storage
  objectbox: 5.2.0
  objectbox_flutter_libs: 5.2.0

  # UI
  cached_network_image: 3.4.1

  # TODO: Remove gap package when all features use core/constants/gaps.dart
  gap: 3.0.1
  persistent_bottom_nav_bar_v2: 6.3.2
  skeletonizer: 2.1.3
  smooth_page_indicator: 2.0.1
  auto_size_text: 3.0.0
  better_player_plus: 1.1.5

  # Connectivity
  internet_connection_checker: 3.0.1

  # Utils
  package_info_plus: 9.0.0
  flutter_native_splash: 2.4.7

  # Analytics
  firebase_analytics: 12.2.0

  # Firebase
  firebase_core: 4.6.0

  # AI
  marionette_flutter: 0.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  custom_lint: 0.8.1
  lint_rules:
    path: modules/lint_rules

  # Code Generation
  build_runner: 2.13.1
  freezed: 3.2.3  # pinned: custom_lint 0.8.1 needs analyzer ^8.0.0, freezed 3.2.5+ needs analyzer >=9.0.0
  json_serializable: 6.11.2  # pinned: 6.13.1 needs analyzer >=10.0.0, incompatible with custom_lint 0.8.1
  auto_route_generator: 10.4.0  # pinned: 10.5.0 needs analyzer >=9.0.0, incompatible with custom_lint 0.8.1
  objectbox_generator: 5.2.0

  # Testing
  mocktail: 1.0.4

  # Icons
  flutter_launcher_icons: 0.14.4

  # AI
  marionette_mcp: 0.4.0

flutter_icons:
  android: true
  ios: false
  remove_alpha_ios: false
  image_path: "app_icon/androidnewicon.png"
  adaptive_icon_background: "#101823"
  adaptive_icon_foreground: "app_icon/androidnewround.png"

flutter_native_splash:
  color: "#101823"
  image: app_icon/android_icon.png

flutter:
  uses-material-design: true

  assets:
    - app_icon/
